version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering_pass
      POSTGRES_DB: metering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering"]
      interval: 2s
      timeout: 5s
      retries: 15

  metering-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: metering
      DB_PASSWORD: metering_pass
      DB_NAME: metering
      DB_MAX_CONNECTIONS: 20
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  demo-client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      SERVICE_URL: http://metering-service:3000
    depends_on:
      - metering-service
    # The demo client runs once and exits
    restart: "no"

volumes:
  pgdata:
